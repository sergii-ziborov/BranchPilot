<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BranchPilot Three.js History Graph Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #111827;
        --panel-2: #161b22;
        --line: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --selected: rgba(88, 166, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        min-height: 100vh;
        padding: 16px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      .toolbar h1 {
        margin: 0;
        font-size: 15px;
      }

      .toolbar span {
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
      }

      .graph-layer {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--graph-width);
        z-index: 2;
      }

      .rows {
        position: relative;
        z-index: 1;
        min-height: 100%;
      }

      .row {
        height: 34px;
        display: grid;
        grid-template-columns: var(--graph-width) minmax(0, 1fr);
        align-items: center;
      }

      .row.selected {
        background: var(--selected);
      }

      .row-text {
        min-width: 0;
        padding-left: 10px;
        padding-right: 16px;
      }

      .subject {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: 700;
        font-size: 12px;
      }

      .meta {
        margin-top: 1px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 11px;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div>
          <h1>Three.js Git Graph Prototype</h1>
          <span id="status">Loading history-graph-sample.json…</span>
        </div>
        <span>Uses real git log --graph rows</span>
      </header>
      <section class="stage" id="stage">
        <div class="graph-layer" id="graph-layer"></div>
        <div class="rows" id="rows"></div>
      </section>
    </main>
    <script type="module" src="./history-graph-three.js"></script>
  </body>
</html>
